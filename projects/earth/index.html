<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth Viewer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:system-ui,-apple-system,sans-serif}
canvas{display:block}
#loading{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;transition:opacity 1.2s ease-out}
#loading.done{opacity:0;pointer-events:none}
#loading h1{color:rgba(255,255,255,0.7);font-weight:300;font-size:18px;letter-spacing:4px;text-transform:uppercase;margin-bottom:24px}
#progress-track{width:180px;height:1px;background:rgba(255,255,255,0.08);border-radius:1px;overflow:hidden}
#progress-fill{width:100%;height:100%;background:rgba(255,255,255,0.5);transform:scaleX(0);transform-origin:left;transition:transform 0.4s ease}
#controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.3);font-size:11px;letter-spacing:0.5px;pointer-events:none;transition:opacity 1.5s ease;white-space:nowrap}
#controls.hide{opacity:0}
#fps{position:fixed;top:12px;right:14px;color:rgba(255,255,255,0.2);font-family:'SF Mono',Monaco,Consolas,monospace;font-size:10px;pointer-events:none}
#panel{position:fixed;top:12px;left:14px;display:flex;flex-direction:column;gap:8px;opacity:0;transition:opacity 0.6s}
#panel.show{opacity:1}
#panel label{color:rgba(255,255,255,0.35);font-size:10px;letter-spacing:0.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px;cursor:pointer}
#panel input[type=range]{-webkit-appearance:none;appearance:none;width:100px;height:1px;background:rgba(255,255,255,0.15);outline:none;border-radius:1px}
#panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.5);cursor:pointer}
#panel input[type=range]::-moz-range-thumb{width:8px;height:8px;border:0;border-radius:50%;background:rgba(255,255,255,0.5);cursor:pointer}
#panel input[type=checkbox]{accent-color:rgba(255,255,255,0.55)}
#clock{color:rgba(255,255,255,0.25);font-family:'SF Mono',Monaco,Consolas,monospace;font-size:10px;letter-spacing:0.3px}
</style>
</head>
<body>
<div id="loading"><h1>Loading Earth</h1><div id="progress-track"><div id="progress-fill"></div></div></div>
<div id="controls">Drag to orbit &middot; Scroll to change altitude</div>
<div id="fps"></div>
<div id="panel">
  <label title="Shift the clock (hours). The Sun, Moon and Earth's rotation follow real ephemerides.">Time <input type="range" id="timeOffset" min="-12" max="12" step="0.05" value="0"></label>
  <label title="Time-lapse at 300×; off runs in real time"><input type="checkbox" id="autoRotate" checked> Auto-rotate</label>
  <label><input type="checkbox" id="showClouds" checked> Clouds</label>
  <div id="clock"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"
  }
}
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
