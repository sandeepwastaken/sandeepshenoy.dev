<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPT Console</title>
  <link rel="icon" href="logo.svg?v=20260619-code1" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20260619-code1">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><img src="logo.svg?v=20260619-code1" alt=""></div>
        <div class="brand-copy">
          <strong>GPT Console</strong>
          <span>Private wrapper</span>
        </div>
        <button class="icon-btn sidebar-collapse" id="sidebarCollapseBtn" type="button" title="Collapse menu" aria-label="Collapse menu">
          <img src="menu.svg?v=20260619-code1" alt="">
        </button>
      </div>

      <button class="new-chat" id="newChatBtn" type="button">
        <span aria-hidden="true">+</span>
        New chat
      </button>

      <div class="chat-tools">
        <input id="chatSearch" type="search" placeholder="Search chats" autocomplete="off">
      </div>

      <nav class="chat-list" id="chatList" aria-label="Chats"></nav>

      <div class="account-panel">
        <div>
          <span class="muted">Requests left</span>
          <strong id="requestsLeft">--</strong>
        </div>
        <button class="icon-btn" id="logoutBtn" type="button" title="Log out" aria-label="Log out">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l1.4-1.4L8.8 13H20v-2H8.8l2.6-2.6L10 7l-5 5 5 5z"/><path d="M4 19h8v-2H6V7h6V5H4v14z"/></svg>
        </button>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <button class="icon-btn" id="sidebarToggle" type="button" title="Menu" aria-label="Toggle menu">
          <img src="menu.svg?v=20260619-code1" alt="">
        </button>
        <div class="chat-heading">
          <button class="title-button" id="chatTitleBtn" type="button" title="Rename chat">
            <span id="chatTitle">New chat</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5H7z"/></svg>
          </button>
        </div>
        <button class="icon-btn" id="deleteChatBtn" type="button" title="Delete chat" aria-label="Delete chat">
          <img src="trash.svg?v=20260619-code1" alt="">
        </button>
        <div class="model-wrap">
          <select id="modelSelect" aria-label="Model">
            <option value="gpt-4o">GPT-4o</option>
            <option value="gpt-5.4-mini">GPT-5.4 Mini</option>
            <option value="gpt-5.4">GPT-5.4</option>
            <option value="gpt-5.5">GPT-5.5</option>
          </select>
        </div>
        <div class="connection" id="connectionStatus"><span></span>Disconnected</div>
      </header>

      <section class="messages" id="messages" aria-live="polite"></section>

      <section class="composer-wrap" id="dropZone">
        <div class="attachments" id="attachments"></div>
        <textarea id="promptInput" maxlength="1000" rows="3" placeholder="Message AI..."></textarea>
        <div class="composer-actions">
          <div class="left-actions">
            <button class="icon-btn" id="attachBtn" type="button" title="Upload image" aria-label="Upload image">
              <img src="file.svg?v=20260619-code1" alt="">
            </button>
            <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
          </div>
          <div class="right-actions">
            <span class="char-count" id="charCount">0 / 1000</span>
            <button class="send-btn" id="sendBtn" type="button" title="Send" aria-label="Send">
              <img src="send.svg?v=20260619-code1" alt="">
            </button>
          </div>
        </div>
        <div class="drop-hint">Drag and drop images here or click the image button</div>
      </section>
    </main>
  </div>

  <div class="login-screen" id="loginScreen">
    <form class="login-card" id="loginForm">
      <div class="brand-mark large" aria-hidden="true"><img src="logo.svg?v=20260619-code1" alt=""></div>
      <h1>GPT Console</h1>
      <p>Enter your access token to open the private workspace.</p>
      <label for="tokenInput">Access token</label>
      <input id="tokenInput" name="token" type="password" autocomplete="current-password" placeholder="Paste token" required>
      <button class="primary-btn" type="submit">Continue</button>
      <div class="form-error" id="loginError" role="alert"></div>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js?v=20260619-code1"></script>
</body>
</html>
