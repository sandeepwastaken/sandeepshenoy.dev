<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SciOly Admin Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>SciOly Site Editor</h1>

<div id="editor"></div>

<button id="pushBtn">Push Changes</button>

<div id="modal" class="hidden">
  <div class="modal-content">
    <p>Are you sure you want to push changes?</p>
    <button id="confirmPush">Confirm</button>
    <button id="cancelPush">Cancel</button>
  </div>
</div>

<script>
  (function () {
    var d = new Date();
    var v = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
    document.write('<script src="editor.js?v=' + v + '"><\/script>');
  })();
</script>
</body>
</html>
